---
- name: memcached | Install package
  ansible.builtin.apt:
    name: memcached
    state: present
    update_cache: true
  register: apt_memcached
  until: apt_memcached is success
  retries: 3
  delay: 5
  environment: "{{ proxy_env | default({}) }}"
  tags: memcached, custom_stack

- name: memcached | Ensure pid directory exists
  ansible.builtin.file:
    path: "{{ memcached_pid_file | dirname }}"
    state: directory
    owner: "{{ memcached_user }}"
    group: "{{ memcached_user }}"
    mode: "0755"
  tags: memcached, custom_stack

- name: memcached | Render /etc/memcached.conf
  ansible.builtin.template:
    src: memcached.conf.j2
    dest: /etc/memcached.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart memcached
  tags: memcached, custom_stack

- name: memcached | Enable and start service
  ansible.builtin.systemd:
    name: memcached
    state: started
    enabled: true
  tags: memcached, custom_stack
