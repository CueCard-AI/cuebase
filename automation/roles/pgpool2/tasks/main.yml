---
- name: pgpool2 | Install package
  ansible.builtin.apt:
    name: pgpool2
    state: present
    update_cache: true
  register: apt_pgpool2
  until: apt_pgpool2 is success
  retries: 3
  delay: 5
  environment: "{{ proxy_env | default({}) }}"
  tags: pgpool2, custom_stack

- name: pgpool2 | Ensure required dirs
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "{{ item.mode }}"
  loop:
    - { path: "/etc/pgpool2", mode: "0755" }
    - { path: "/var/run/pgpool2", mode: "0755" }
    - { path: "/var/log/pgpool2", mode: "0755" }
    - { path: "{{ pgpool2_cache_oiddir }}", mode: "0755" }
  tags: pgpool2, custom_stack

- name: pgpool2 | Set current_leader_ip if not already provided
  # If invoked from the custom_stack playbook, cluster_leader_ip is already
  # set by the pre_tasks; honour that. Otherwise fall back to patronictl.
  ansible.builtin.set_fact:
    current_leader_ip: "{{ cluster_leader_ip }}"
  when: cluster_leader_ip is defined and current_leader_ip is not defined
  tags: pgpool2, custom_stack

- name: pgpool2 | Discover leader via patronictl (standalone fallback)
  ansible.builtin.command:
    cmd: patronictl -c /etc/patroni/patroni.yml list -f json
  register: pgpool2_patronictl
  changed_when: false
  when: current_leader_ip is not defined
  tags: pgpool2, custom_stack

- name: pgpool2 | Set current_leader_ip from patronictl
  ansible.builtin.set_fact:
    current_leader_ip: >-
      {{
        (pgpool2_patronictl.stdout | from_json
          | selectattr('Role', 'equalto', 'Leader')
          | map(attribute='Host')
          | first
        )
      }}
  when: current_leader_ip is not defined
  tags: pgpool2, custom_stack

- name: pgpool2 | Render pgpool.conf
  ansible.builtin.template:
    src: pgpool.conf.j2
    dest: /etc/pgpool2/pgpool.conf
    owner: postgres
    group: postgres
    mode: "0644"
  notify: reload pgpool2
  tags: pgpool2, custom_stack

- name: pgpool2 | Render pcp.conf
  ansible.builtin.template:
    src: pcp.conf.j2
    dest: /etc/pgpool2/pcp.conf
    owner: postgres
    group: postgres
    mode: "0600"
  when: pgpool2_pcp_user is defined
  notify: reload pgpool2
  tags: pgpool2, custom_stack

- name: pgpool2 | Render pool_hba.conf
  ansible.builtin.template:
    src: pool_hba.conf.j2
    dest: /etc/pgpool2/pool_hba.conf
    owner: postgres
    group: postgres
    mode: "0640"
  notify: reload pgpool2
  tags: pgpool2, custom_stack

- name: pgpool2 | Write pool_passwd (plaintext, TEXT-prefix per pgpool 4.x)
  # Format: <user>:TEXT<plaintext-password>
  # pgpool will use the plaintext to do SCRAM authentication with PG when
  # the client connects with SCRAM. Acceptable for a sandbox; for prod
  # use AES-encrypted entries with a POOL_KEY.
  ansible.builtin.copy:
    dest: /etc/pgpool2/pool_passwd
    content: "{{ pgpool2_health_check_user }}:TEXT{{ pgpool2_health_check_password }}\n"
    owner: postgres
    group: postgres
    mode: "0600"
  no_log: true
  notify: reload pgpool2
  tags: pgpool2, custom_stack

- name: pgpool2 | Install Patroni leader-tracking callback script
  ansible.builtin.copy:
    src: update_pgpool_backends.sh
    dest: "{{ pgpool2_callback_script }}"
    owner: root
    group: root
    mode: "0755"
  tags: pgpool2, custom_stack

- name: pgpool2 | Wire callback into Patroni
  # Adds on_role_change/on_start/on_restart/on_reload callbacks to patroni.yml.
  # The autobase Patroni role doesn't manage callbacks, so we patch in place
  # using a marker so re-runs are idempotent.
  ansible.builtin.blockinfile:
    path: /etc/patroni/patroni.yml
    marker: "# {mark} ANSIBLE MANAGED — pgpool callbacks"
    insertafter: '^postgresql:'
    block: |2
        callbacks:
          on_start: {{ pgpool2_callback_script }}
          on_restart: {{ pgpool2_callback_script }}
          on_role_change: {{ pgpool2_callback_script }}
          on_reload: {{ pgpool2_callback_script }}
  notify: reload patroni
  tags: pgpool2, custom_stack

- name: pgpool2 | Enable and start service
  ansible.builtin.systemd:
    name: pgpool2
    state: started
    enabled: true
  tags: pgpool2, custom_stack
